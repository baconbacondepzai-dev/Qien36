<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qien36 - AI Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Hiệu ứng Liquid Glassmorphism */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .liquid-glass-input {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-indigo-950 text-white h-screen flex overflow-hidden font-sans">

    <!-- Sidebar Lịch sử trò chuyện (Thanh kéo/trượt) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 liquid-glass z-40 transform -translate-x-full transition-transform duration-300 md:relative md:translate-x-0 flex flex-col justify-between p-4">
        <div>
            <div class="flex items-center justify-between mb-6">
                <h2 class="font-bold text-lg tracking-wide flex items-center gap-2">
                    <i data-lucide="history"></i> Lịch Sử Chat
                </h2>
                <button onclick="toggleSidebar()" class="md:hidden text-gray-300 hover:text-white">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <button onclick="startNewChat()" class="w-full py-2.5 px-4 liquid-glass-input rounded-xl hover:bg-white/20 transition flex items-center justify-center gap-2 mb-4 font-medium">
                <i data-lucide="plus"></i> Cuộc trò chuyện mới
            </button>
            <div id="history-list" class="space-y-2 overflow-y-auto max-h-[calc(100vh-200px)]">
                <!-- Danh sách lịch sử sẽ load ở đây -->
            </div>
        </div>

        <!-- Khu vực người dùng / Đăng nhập -->
        <div id="auth-section" class="border-t border-white/10 pt-4">
            <button id="btn-login" onclick="loginWithGoogle()" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl transition font-medium flex items-center justify-center gap-2">
                <i data-lucide="log-in"></i> Đăng nhập bằng Google
            </button>
            <div id="user-profile" class="hidden flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <img id="user-avatar" class="w-8 h-8 rounded-full border border-white/30" src="" alt="User">
                    <span id="user-name" class="text-sm font-medium truncate max-w-[120px]"></span>
                </div>
                <button onclick="logout()" class="text-xs bg-red-500/20 hover:bg-red-500/40 text-red-300 px-3 py-1.5 rounded-lg border border-red-500/30 transition">Đăng xuất</button>
            </div>
        </div>
    </aside>

    <!-- Khu vực chính Trò chuyện -->
    <main class="flex-1 flex flex-col h-full relative">
        <!-- Header -->
        <header class="p-4 liquid-glass flex items-center justify-between border-b border-white/10">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-300 hover:text-white">
                    <i data-lucide="menu"></i>
                </button>
                <!-- Avatar Sói Trắng Chibi -->
                <div class="relative">
                    <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Qien36Wolf&backgroundColor=b6e3f4" alt="Qien36 Avatar" class="w-11 h-11 rounded-full border-2 border-indigo-400/50 bg-slate-800 object-cover shadow-lg">
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide">Qien36 🐺</h1>
                    <p class="text-xs text-indigo-300/80">Sói trắng Chibi • Độc hại & Hài hước</p>
                </div>
            </div>
        </header>

        <!-- Khung tin nhắn -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
            <!-- Tin nhắn chào mừng mặc định -->
            <div class="flex gap-3">
                <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Qien36Wolf&backgroundColor=b6e3f4" class="w-8 h-8 rounded-full bg-slate-800 border border-white/20">
                <div class="liquid-glass p-3.5 rounded-2xl rounded-tl-none max-w-[80%] text-sm leading-relaxed">
                    Nói cái gì đấy? Nhìn cái gì mà nhìn, muốn hỏi gì thì nói nhanh lên để tao còn đi ngủ! 🐺
                </div>
            </div>
        </div>

        <!-- Khung nhập tin nhắn -->
        <div class="p-4 liquid-glass border-t border-white/10">
            <form id="chat-form" onsubmit="sendMessage(event)" class="flex gap-2">
                <input id="user-input" type="text" placeholder="Nhắn tin với Qien36..." autocomplete="off" class="flex-1 liquid-glass-input text-sm text-white placeholder-gray-400 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-400 transition">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl transition flex items-center justify-center">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chat-box');
            const isUser = sender === 'user';
            
            const msgHTML = `
                <div class="flex gap-3 ${isUser ? 'justify-end' : ''}">
                    ${!isUser ? `<img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Qien36Wolf&backgroundColor=b6e3f4" class="w-8 h-8 rounded-full bg-slate-800 border border-white/20">` : ''}
                    <div class="${isUser ? 'bg-indigo-600/80 text-white rounded-tr-none' : 'liquid-glass text-gray-100 rounded-tl-none'} p-3.5 rounded-2xl max-w-[80%] text-sm leading-relaxed shadow-sm">
                        ${text}
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', msgHTML);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';

            // Gọi tới Server Backend để xử lý AI
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                appendMessage('bot', data.reply);
            } catch (err) {
                appendMessage('bot', 'Lỗi kết nối rồi tào lao quá! Bật server lên chưa đấy?');
            }
        }

        function startNewChat() {
            document.getElementById('chat-box').innerHTML = '';
            appendMessage('bot', 'Nhìn cái gì? Trò chuyện mới đây, xàm lờ ít thôi nhé! 🐺');
        }

        function loginWithGoogle() {
            alert("Tích hợp Firebase Auth theo hướng dẫn ở mục 3 bên dưới để kích hoạt Đăng nhập Google!");
        }
    </script>
</body>
</html>
